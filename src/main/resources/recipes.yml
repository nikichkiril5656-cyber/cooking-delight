version: 7

# Группы ингредиентов (аналог тегов из мода). В рецептах пишутся как #имя.
# В группах и рецептах можно писать материал (CARROT) или id предмета плагина из config.yml (onion).
# В ванили нет макарон и ломтиков тыквы, поэтому там заменители.
tags:
  onion: [onion]
  leafy_green: [cabbage_leaf, cabbage]
  pasta: [raw_pasta]
  bread: [BREAD]
  milk: [MILK_BUCKET]
  eggs: [EGG]
  raw_pork: [PORKCHOP, bacon]
  raw_chicken: [CHICKEN, chicken_cuts]
  pumpkin_slice: [pumpkin_slice]
  vegetable: [CARROT, POTATO, BEETROOT, onion, cabbage, tomato, PUMPKIN, pumpkin_slice]

# Как показывать большие группы в книге рецептов.
tag-names:
  vegetable: "Любой овощ"

# Рецепты кастрюли. Порядок ингредиентов не важен, каждый занимает один слот.
# result.nutrition / result.saturation: сытость и насыщение блюда (как в команде /give ... food={...}).
# effects: ТИП:секунды:уровень (уровень 0 = I). Выдаются при съедении.
pot:
  vegetable_soup:
    ingredients: [CARROT, POTATO, BEETROOT, "#leafy_green"]
    container: BOWL
    time: 10
    result:
      material: BEETROOT_SOUP
      name: "<green>Овощной суп"
      model: "cookingdelight:vegetable_soup"
      nutrition: 11
      saturation: 13.2
    effects:
      - "REGENERATION:5:0"
  beetroot_soup:
    ingredients: [BEETROOT, BEETROOT, BEETROOT]
    container: BOWL
    time: 10
    result:
      material: BEETROOT_SOUP
  beef_stew:
    ingredients: [BEEF, CARROT, POTATO, "#onion"]
    container: BOWL
    time: 15
    result:
      material: RABBIT_STEW
      name: "<gold>Тушёная говядина"
      model: "cookingdelight:beef_stew"
      nutrition: 14
      saturation: 16.8
    effects:
      - "ABSORPTION:60:0"
      - "REGENERATION:5:0"
  onion_soup:
    ingredients: ["#onion", "#onion", "#bread", "#milk"]
    container: BOWL
    time: 12
    result:
      material: MUSHROOM_STEW
      name: "<yellow>Луковый суп"
      model: "cookingdelight:onion_soup"
      nutrition: 11
      saturation: 13.2
  pumpkin_soup:
    ingredients: ["#pumpkin_slice", "#leafy_green", "#raw_pork", "#milk"]
    container: BOWL
    time: 12
    result:
      material: BEETROOT_SOUP
      name: "<gold>Тыквенный суп"
      model: "cookingdelight:pumpkin_soup"
      nutrition: 12
      saturation: 14.4
  chicken_soup:
    ingredients: ["#raw_chicken", CARROT, "#leafy_green", "#vegetable"]
    container: BOWL
    time: 15
    result:
      material: MUSHROOM_STEW
      name: "<yellow>Куриный суп"
      model: "cookingdelight:chicken_soup"
      nutrition: 12
      saturation: 14.4
    effects:
      - "REGENERATION:10:0"
  noodle_soup:
    ingredients: ["#pasta", "#eggs", DRIED_KELP, "#raw_pork"]
    container: BOWL
    time: 15
    result:
      material: RABBIT_STEW
      name: "<white>Лапша в бульоне"
      model: "cookingdelight:noodle_soup"
      nutrition: 13
      saturation: 15.6

  # Блюда целиком (ставятся на стол): рецепты придуманы по мотивам мода, меняй как угодно.
  roast_chicken_feast:
    ingredients: [CHICKEN, "#onion", CARROT, POTATO, "#leafy_green", BREAD]
    time: 25
    result: {item: roast_chicken_block}
  honey_glazed_ham_feast:
    ingredients: [PORKCHOP, PORKCHOP, HONEY_BOTTLE, "#onion", CARROT, APPLE]
    time: 25
    result: {item: honey_glazed_ham_block}
  shepherds_pie_feast:
    ingredients: [MUTTON, MUTTON, "#onion", CARROT, POTATO, wheat_dough]
    time: 25
    result: {item: shepherds_pie_block}
  gleaming_salad_feast:
    ingredients: ["#leafy_green", "#leafy_green", tomato, "#onion", CARROT, DRIED_KELP]
    time: 20
    result: {item: gleaming_salad_block}
  rice_roll_medley_feast:
    ingredients: [rice, rice, salmon_slice, cod_slice, DRIED_KELP, "#leafy_green"]
    time: 25
    result: {item: rice_roll_medley_block}
  stuffed_pumpkin_feast:
    ingredients: [PUMPKIN, rice, CARROT, "#onion", "#leafy_green", "#raw_pork"]
    time: 25
    result: {item: stuffed_pumpkin_block}

  # Блюда из полного набора мода: рецепты придуманы по мотивам оригинала, меняй как угодно.
  tomato_sauce_pot:
    ingredients: [tomato, tomato, tomato]
    container: BOWL
    time: 10
    result: {item: tomato_sauce}
  bacon_and_eggs_pot:
    ingredients: [cooked_bacon, fried_egg, fried_egg]
    container: BOWL
    time: 10
    result: {item: bacon_and_eggs}
  baked_cod_stew_pot:
    ingredients: [COD, POTATO, tomato, EGG]
    container: BOWL
    time: 15
    result: {item: baked_cod_stew}
  bone_broth_pot:
    ingredients: [BONE, BONE, "#onion", CARROT]
    container: BOWL
    time: 20
    result: {item: bone_broth}
  fish_stew_pot:
    ingredients: [COD, SALMON, "#onion", tomato, "#leafy_green"]
    container: BOWL
    time: 15
    result: {item: fish_stew}
  fried_rice_pot:
    ingredients: [cooked_rice, fried_egg, CARROT, "#onion"]
    container: BOWL
    time: 12
    result: {item: fried_rice}
  grilled_salmon_pot:
    ingredients: [salmon_slice, salmon_slice, "#leafy_green", "#onion"]
    container: BOWL
    time: 12
    result: {item: grilled_salmon}
  mushroom_rice_pot:
    ingredients: [cooked_rice, BROWN_MUSHROOM, RED_MUSHROOM, "#onion"]
    container: BOWL
    time: 12
    result: {item: mushroom_rice}
  pasta_with_meatballs_pot:
    ingredients: [raw_pasta, minced_beef, minced_beef, tomato_sauce]
    container: BOWL
    time: 15
    result: {item: pasta_with_meatballs}
  pasta_with_mutton_chop_pot:
    ingredients: [raw_pasta, cooked_mutton_chops, tomato_sauce]
    container: BOWL
    time: 15
    result: {item: pasta_with_mutton_chop}
  squid_ink_pasta_pot:
    ingredients: [raw_pasta, INK_SAC, "#onion", cod_slice]
    container: BOWL
    time: 15
    result: {item: squid_ink_pasta}
  ratatouille_pot:
    ingredients: [tomato, tomato, "#onion", CARROT, "#leafy_green"]
    container: BOWL
    time: 15
    result: {item: ratatouille}
  roasted_mutton_chops_pot:
    ingredients: [mutton_chops, mutton_chops, tomato, "#onion"]
    container: BOWL
    time: 18
    result: {item: roasted_mutton_chops}
  steak_and_potatoes_pot:
    ingredients: [COOKED_BEEF, BAKED_POTATO, "#leafy_green"]
    container: BOWL
    time: 15
    result: {item: steak_and_potatoes}
  stuffed_potato_pot:
    ingredients: [BAKED_POTATO, minced_beef, "#onion", cabbage_leaf]
    time: 15
    result: {item: stuffed_potato}

# Сковорода: положи сырую еду ПКМ, она жарится над огнём. time: секунды.
skillet:
  BEEF: {result: COOKED_BEEF, time: 8}
  PORKCHOP: {result: COOKED_PORKCHOP, time: 8}
  CHICKEN: {result: COOKED_CHICKEN, time: 8}
  MUTTON: {result: COOKED_MUTTON, time: 8}
  RABBIT: {result: COOKED_RABBIT, time: 8}
  COD: {result: COOKED_COD, time: 6}
  SALMON: {result: COOKED_SALMON, time: 6}
  POTATO: {result: BAKED_POTATO, time: 10}
  bacon: {result: cooked_bacon, time: 6}
  chicken_cuts: {result: cooked_chicken_cuts, time: 5}
  mutton_chops: {result: cooked_mutton_chops, time: 5}
  cod_slice: {result: cooked_cod_slice, time: 4}
  wheat_dough: {result: BREAD, time: 8}
  EGG: {result: fried_egg, time: 4}
  minced_beef: {result: beef_patty, time: 6}
  salmon_slice: {result: cooked_salmon_slice, time: 4}

# Разделочная доска: положи предмет на доску ПКМ, затем бей ножом (ПКМ).
cutting:
  PUMPKIN: {result: pumpkin_slice, amount: 4}
  MELON: {result: MELON_SLICE, amount: 9}
  SUGAR_CANE: {result: SUGAR, amount: 2}
  PORKCHOP: {result: bacon, amount: 2}
  CHICKEN: {result: chicken_cuts, amount: 2}
  MUTTON: {result: mutton_chops, amount: 2}
  COD: {result: cod_slice, amount: 2}
  SALMON: {result: salmon_slice, amount: 2}
  cabbage: {result: cabbage_leaf, amount: 2}
  BEEF: {result: minced_beef, amount: 2}
  CAKE: {result: cake_slice, amount: 7}
  PUMPKIN_PIE: {result: pumpkin_pie_slice, amount: 4}
  apple_pie: {result: apple_pie_slice, amount: 4}
  chocolate_pie: {result: chocolate_pie_slice, amount: 4}
  sweet_berry_cheesecake: {result: sweet_berry_cheesecake_slice, amount: 4}
  rice_panicle: {result: rice, amount: 2}
  wheat_dough: {result: raw_pasta, amount: 1}
  kelp_roll: {result: kelp_roll_slice, amount: 3}
