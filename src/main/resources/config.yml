# Что греет кастрюлю, если стоит под ней.
# Костры и печи должны гореть (lit).
heat-sources:
  - CAMPFIRE
  - SOUL_CAMPFIRE
  - FURNACE
  - SMOKER
  - BLAST_FURNACE
  - FIRE
  - SOUL_FIRE
  - LAVA
  - MAGMA_BLOCK

# Культуры. Рост идёт только при свете (уровень 9+), на сухой грядке вдвое медленнее.
crops:
  tomato:
    seeds: tomato_seeds     # id предмета-семян
    fruit: tomato           # id плода
    stages: 8               # 0-3 росток, 4-7 плодоносящий куст (7 = спелый)
    regrow-stage: 4         # на какую стадию возвращается куст после сбора
    stage-seconds: 90       # секунд на одну стадию
    fruit-min: 1
    fruit-max: 3
    wild-chance: 0.05       # шанс дикого куста на каждый новый чанк в подходящем биоме
    wild-biomes: [desert, badlands, eroded_badlands, wooded_badlands, savanna, savanna_plateau, windswept_savanna]

  cabbage:
    seeds: cabbage_seeds
    fruit: cabbage
    stages: 8
    regrow-stage: -1        # после сбора куст исчезает, остаются семена
    harvest-seeds: 1
    stage-seconds: 60
    fruit-min: 1
    fruit-max: 1
    wild-chance: 0.05
    wild-biomes: [beach, snowy_beach, stony_shore]
  onion:
    seeds: onion            # лук сажается сам
    fruit: onion
    stages: 4
    regrow-stage: -1
    harvest-seeds: 1
    stage-seconds: 120
    fruit-min: 1
    fruit-max: 2
    wild-chance: 0.05
    wild-biomes: [plains, sunflower_plains, forest, birch_forest, flower_forest, meadow]
  # Только дикие кусты (обычная посадка у этих культур ванильная)
  beetroot:
    fruit: BEETROOT
    wild-chance: 0.04
    wild-biomes: [beach, snowy_beach, stony_shore]
  carrot:
    fruit: CARROT
    wild-chance: 0.04
    wild-biomes: [plains, forest, birch_forest, meadow]
  potato:
    fruit: POTATO
    wild-chance: 0.04
    wild-biomes: [taiga, snowy_taiga, old_growth_pine_taiga, old_growth_spruce_taiga, snowy_plains, grove]
  # Рис растёт в воде: нижняя часть и метёлки сверху (стадии 4-7)
  rice:
    seeds: rice
    fruit: rice_panicle
    habitat: water
    stages: 8
    upper-from-stage: 4
    supporting: true
    wild-upper: true
    regrow-stage: 4
    bonus: straw          # дополнительная добыча при сборе
    bonus-amount: 1
    stage-seconds: 80
    fruit-min: 1
    fruit-max: 2
    wild-chance: 0.05
    wild-biomes: [swamp, mangrove_swamp, jungle, sparse_jungle, bamboo_jungle]

# Блюда на столе: ПКМ посудой (container) берёт порцию. Shift+ЛКМ забирает блюдо, если порции целы.
feasts:
  roast_chicken:
    block-item: roast_chicken_block
    serving: roast_chicken
    servings: 4
    container: BOWL
    leftovers: true
  honey_glazed_ham:
    block-item: honey_glazed_ham_block
