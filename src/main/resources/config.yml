# Кастомные предметы. Любой id, заканчивающийся на _knife, работает как нож.
# Прочность ножа берётся от базового материала. model = item_model из ресурспака (namespace:path), необязательно.
items:
  pot:
    material: BARREL
    name: "<gold>Кастрюля"
    model: "cookingdelight:cooking_pot"
  board:
    material: BROWN_CARPET
    name: "<yellow>Разделочная доска"
    model: "cookingdelight:cutting_board"
  skillet:
    material: IRON_TRAPDOOR
    name: "<gray>Сковорода"
    model: "cookingdelight:skillet"
    lore:
      - "Ставится над огнём."
      - "ПКМ сырой едой, чтобы пожарить."
  stove:
    material: FURNACE
    name: "<red>Кухонная печь"
    model: "cookingdelight:stove"
    lore:
      - "Плавит в 1.5 раза быстрее обычной печи."
      - "Кастрюля и сковорода над ней готовят быстрее."
  tomato:
    material: APPLE
    name: "<red>Помидор"
    model: "cookingdelight:tomato"
    nutrition: 1
    saturation: 0.6
  tomato_seeds:
    material: BEETROOT_SEEDS
    name: "<green>Семена помидора"
    model: "cookingdelight:tomato_seeds"
    lore:
      - "Сажай на вспаханную землю."
  flint_knife:
    material: STONE_SWORD
    name: "<gray>Кремнёвый нож"
    model: "cookingdelight:flint_knife"
  iron_knife:
    material: IRON_SWORD
    name: "<white>Железный нож"
    model: "cookingdelight:iron_knife"
  golden_knife:
    material: GOLDEN_SWORD
    name: "<yellow>Золотой нож"
    model: "cookingdelight:golden_knife"
  diamond_knife:
    material: DIAMOND_SWORD
    name: "<aqua>Алмазный нож"
    model: "cookingdelight:diamond_knife"
  netherite_knife:
    material: NETHERITE_SWORD
    name: "<dark_gray>Незеритовый нож"
    model: "cookingdelight:netherite_knife"

# Что греет кастрюлю, если стоит под ней.
# Костры и печи должны гореть (lit).
heat-sources:
  - CAMPFIRE
  - SOUL_CAMPFIRE
  - FURNACE
  - SMOKER
  - BLAST_FURNACE
  - FIRE
  - SOUL_FIRE
  - LAVA
  - MAGMA_BLOCK

# Культуры. Рост идёт только при свете (уровень 9+), на сухой грядке вдвое медленнее.
crops:
  tomato:
    seeds: tomato_seeds     # id предмета-семян
    fruit: tomato           # id плода
    stages: 8               # 0-3 росток, 4-7 плодоносящий куст (7 = спелый)
    regrow-stage: 4         # на какую стадию возвращается куст после сбора
    stage-seconds: 90       # секунд на одну стадию
    fruit-min: 1
    fruit-max: 3
    wild-chance: 0.05       # шанс дикого куста на каждый новый чанк в подходящем биоме
    wild-biomes: [desert, badlands, eroded_badlands, wooded_badlands, savanna, savanna_plateau, windswept_savanna]
